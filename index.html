        // سیستم ورودی صوتی (Web Speech API)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            speechRecognition = new SpeechRecognition();
            speechRecognition.continuous = false;
            speechRecognition.interimResults = true;
            speechRecognition.lang = 'fa-IR'; // زبان فارسی

            speechRecognition.onstart = () => {
                isRecordingVoice = true;
                voiceInputBtn.classList.remove('bg-slate-100', 'text-slate-700');
                voiceInputBtn.classList.add('bg-rose-500', 'text-white', 'animate-pulse');
                taskInput.placeholder = "در حال شنیدن صدای شما...";
                showNotification("صحبت کنید، در حال شنیدن صدای شما...");
            };

            speechRecognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript;
                }
                taskInput.value = transcript;
            };

            speechRecognition.onerror = (event) => {
                console.error("خطای ضبط صوتی:", event.error);
                showNotification(`خطا در دریافت صدا: ${event.error}`);
                stopVoiceRecognition();
            };

            speechRecognition.onend = () => {
                stopVoiceRecognition();
            };
        } else {
            if (voiceInputBtn) {
                voiceInputBtn.title = "مرورگر شما از ورودی صوتی پشتیبانی نمی‌کند";
                voiceInputBtn.classList.add('opacity-50');
            }
        }

        function stopVoiceRecognition() {
            isRecordingVoice = false;
            if (voiceInputBtn) {
                voiceInputBtn.classList.remove('bg-rose-500', 'text-white', 'animate-pulse');
                voiceInputBtn.classList.add('bg-slate-100', 'text-slate-700');
            }
            if (taskInput) {
                taskInput.placeholder = "کار جدید را بنویسید یا با میکروفون بگویید...";
            }
        }

        if (voiceInputBtn) {
            voiceInputBtn.onclick = () => {
                if (!SpeechRecognition) {
                    showNotification("مرورگر شما از ورودی صوتی پشتیبانی نمی‌کند (در کروم تست کنید)");
                    return;
                }
                if (isRecordingVoice) {
                    speechRecognition.stop();
                } else {
                    try {
                        speechRecognition.start();
                    } catch (e) {
                        speechRecognition.stop();
                    }
                }
            };
        }

        // سیستم اعلان‌ها (Notifications)
        function checkNotificationPermission() {
            if (!("Notification" in window)) {
                if (notifyPermBtn) notifyPermBtn.classList.add('hidden');
                return;
            }

            if (Notification.permission === 'granted') {
                if (notifyPermLabel) notifyPermLabel.textContent = "اعلان فعال";
                if (notifyPermBtn) {
                    notifyPermBtn.classList.remove('bg-indigo-500/50');
                    notifyPermBtn.classList.add('bg-emerald-500');
                }
            } else {
                if (notifyPermLabel) notifyPermLabel.textContent = "اعلان";
            }
        }

        async function requestNotificationPermission() {
            if (!("Notification" in window)) {
                showNotification("مرورگر شما از نوتیفیکیشن پشتیبانی نمی‌کند");
                return;
            }

            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                showNotification("اعلان‌ها با موفقیت فعال شدند!");
                checkNotificationPermission();
                sendSystemNotification("یادآور کارها فعال شد", "از این پس سررسید کارها به شما یادآوری خواهد شد.");
            } else {
                showNotification("دسترسی به اعلان‌ها رد شد");
            }
        }

        if (notifyPermBtn) {
            notifyPermBtn.onclick = requestNotificationPermission;
        }

        function sendSystemNotification(title, body) {
            if (!("Notification" in window) || Notification.permission !== "granted") return;
            try {
                const options = {
                    body: body,
                    icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192' fill='%234f46e5'><rect width='192' height='192' rx='40' fill='%234f46e5'/><path d='M75 130L45 100l10-10 20 20 60-60 10 10z' fill='white'/></svg>",
                    badge: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192' fill='%234f46e5'><circle cx='96' cy='96' r='90' fill='%234f46e5'/></svg>",
                    vibrate: [200, 100, 200]
                };
                new Notification(title, options);
            } catch (e) {
                console.error("خطا در ارسال نوتیفیکیشن:", e);
            }
        }

        // بررسی موعد کارهای دارای تاریخ برای ارسال نوتیفیکیشن یادآوری
        const notifiedTasksSet = new Set();
        function checkTaskDueReminders() {
            if (!("Notification" in window) || Notification.permission !== "granted") return;
            const todayStr = new Date().toISOString().slice(0, 10);

            todos.forEach(t => {
                if (!t.done && !t.archived && t.dueDate === todayStr && !notifiedTasksSet.has(t.id)) {
                    sendSystemNotification("⏰ موعد سررسید کار!", `امروز موعد انجام کار «${t.title}» است.`);
                    notifiedTasksSet.add(t.id);
                }
            });
        }
        setInterval(checkTaskDueReminders, 60000); // بررسی هر یک دقیقه

        // سیستم تایمر تمرکز پومودورو (Pomodoro)
        function formatPomoTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function startPomodoro(task) {
            if (activePomodoroTask && activePomodoroTask.id !== task.id) {
                stopPomodoro(false);
            }

            activePomodoroTask = task;
            pomodoroRemainingSeconds = 25 * 60;
            pomodoroTotalDuration = 25 * 60;
            pomodoroIsPaused = false;

            pomoTaskName.textContent = task.title;
            pomoTimerDisplay.textContent = formatPomoTime(pomodoroRemainingSeconds);
            pomoPauseBtn.textContent = '⏸️';
            pomodoroBar.classList.remove('hidden');

            if (pomodoroTimerInterval) clearInterval(pomodoroTimerInterval);

            pomodoroTimerInterval = setInterval(() => {
                if (pomodoroIsPaused) return;

                pomodoroRemainingSeconds--;
                pomoTimerDisplay.textContent = formatPomoTime(pomodoroRemainingSeconds);

                if (pomodoroRemainingSeconds <= 0) {
                    clearInterval(pomodoroTimerInterval);
                    sendSystemNotification("🍅 زمان تمرکز به پایان رسید!", `۲۵ دقیقه تمرکز روی «${task.title}» تکمیل شد.`);
                    showNotification(`زمان تمرکز روی «${task.title}» تمام شد! خداقوت.`);
                    stopPomodoro(true);
                }
            }, 1000);

            showNotification(`تمرکز روی «${task.title}» آغاز شد (۲۵ دقیقه)`);
            renderUI();
        }

        function stopPomodoro(completed = false) {
            if (!activePomodoroTask) return;

            const spentMinutes = Math.max(1, Math.round((pomodoroTotalDuration - pomodoroRemainingSeconds) / 60));
            const currentTask = todos.find(t => t.id === activePomodoroTask.id);

            if (currentTask) {
                const prev = currentTask.actualMinutes || 0;
                currentTask.actualMinutes = prev + spentMinutes;
                saveLocalData();
                showNotification(`${spentMinutes} دقیقه زمان واقعی روی «${currentTask.title}» ثبت شد`);
            }

            if (pomodoroTimerInterval) clearInterval(pomodoroTimerInterval);
            activePomodoroTask = null;
            pomodoroBar.classList.add('hidden');
            renderUI();
        }

        if (pomoPauseBtn) {
            pomoPauseBtn.onclick = () => {
                pomodoroIsPaused = !pomodoroIsPaused;
                pomoPauseBtn.textContent = pomodoroIsPaused ? '▶️' : '⏸️';
                showNotification(pomodoroIsPaused ? "تایمر متوقف شد" : "تایمر ادامه یافت");
            };
        }

        if (pomoStopBtn) {
            pomoStopBtn.onclick = () => {
                stopPomodoro(false);
            };
        }

        checkNotificationPermission();
        setTimeout(checkTaskDueReminders, 2000);
